[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xieido-pricechange"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告第三方接口的价格变更相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xieido" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://xieido.github.io"
Repository = "https://github.com/xieido/pricechange"
Issues = "https://github.com/xieido/pricechange/issues"

[project.scripts]
pricechange = "pricechange:main"

[tool.setuptools]
py-modules = ["pricechange"]
